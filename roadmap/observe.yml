# yaml-language-server: $schema=schema.json
prefix: OBS
title: Observe
order: 1
summary: This pillar tracks live state across local repositories, GitHub accounts, AI provider quotas, local models, and host resources.
features:
  - id: OBS-01
    title: Repository Discovery and Live Watch
    status: shipped
    scope: core
    docs: docs/apps/repos.md
    summary: Read-only discovery finds Git repositories under watched folders, tracks file changes live, applies skip rules, and imports saved folder settings on first launch.
    depends_on: []

  - id: OBS-02
    title: Local Git and Remote Status Engine
    status: shipped
    scope: core
    docs: docs/apps/repos.md
    summary: Background workers inspect branches, uncommitted files, stashes, worktrees, submodules, remote divergence, GitHub visibility, account repository lists, and Repository Location state.
    depends_on: [OBS-01]

  - id: OBS-03
    title: CLI Quota and Probe Runner
    status: shipped
    scope: core
    docs: docs/apps/agents.md
    summary: An isolated PTY runner reads usage screens for Claude, Kimi, and Antigravity and parses Codex rollout limits from local session files.
    depends_on: []

  - id: OBS-04
    title: Provider Quota API Adapters
    status: shipped
    scope: core
    docs: docs/apps/agents.md
    summary: Read-only HTTP adapters fetch account quotas and credit balances for GLM, ZCode, Mistral, MiniMax, DeepSeek, and Xiaomi with macOS Keychain keys.
    depends_on: []

  - id: OBS-05
    title: Local Ollama Memory Monitor
    status: shipped
    scope: core
    docs: docs/apps/agents.md
    summary: A five-second poller reads loaded Ollama models, GPU residency, memory pressure, and KV cache estimates with a ten-minute timeline.
    depends_on: []

  - id: OBS-06
    title: Installed Agent Tool Discovery
    status: shipped
    scope: core
    docs: docs/apps/agents.md
    summary: Background discovery detects local agent CLIs and desktop apps, checks tool versions and sign-in state, and loads native or bundled icons.
    depends_on: []

  - id: OBS-07
    title: GitHub Observation
    status: planned
    scope: core
    summary: A GitHub observer tracks pull requests, review state, open issues, workflow runs, and release checks across tracked repositories.
    depends_on: [OBS-02]

  - id: OBS-08
    title: Machine Resource Telemetry
    status: planned
    scope: peripheral
    summary: Host telemetry measures physical memory, CPU load, GPU pressure, active Linux VMs, and remote host health for capacity views.
    depends_on: [OBS-05, RUN-03, RUN-05]

  - id: OBS-09
    title: Remote Host Observation
    status: planned
    scope: peripheral
    summary: Remote observers stream live repository, local model, and process state from connected Linux and macOS hosts into Astrolabe.
    depends_on: [OBS-02, OBS-05, RUN-05]
