# yaml-language-server: $schema=schema.json
prefix: OBS
title: Observe
order: 1
summary: This pillar tracks live state across local repositories, AI provider accounts, local models, token usage, Artisan VM applications, and machine resources.
features:
  - id: OBS-01
    title: Astrolabe Engines
    status: built
    scope: core
    source: astrolabe
    source_ref: crates/astrolabe-engines
    summary: Shared Rust observation engines unify repository discovery, git and GitHub checks, AI provider quota probes, and local Ollama memory monitors.
    depends_on: [OBS-03, OBS-04, OBS-05, OBS-06, OBS-07]

  - id: OBS-02
    title: Repository Discovery and Watch
    status: existing
    scope: core
    source: repo-monitor
    source_ref: src/discover.rs
    verdict: port
    summary: Recursive read-only discovery finds git repositories under configured roots, tracks filesystem changes live, applies skip rules, and persists manual removals.
    depends_on: []

  - id: OBS-03
    title: Git and GitHub Status Engine
    status: existing
    scope: core
    source: repo-monitor
    source_ref: src/git.rs
    verdict: port
    summary: Background workers inspect branches, uncommitted files, stashes, worktrees, submodules, remote divergence, GitHub visibility, and duplicate clones of one remote.
    depends_on: [OBS-02]

  - id: OBS-04
    title: CLI Quota and Probe Runner
    status: existing
    scope: core
    source: agent-monitor
    source_ref: src/pty.rs
    verdict: port
    summary: An isolated pseudo-terminal runner reads zero-quota usage screens for Claude, Kimi, and Antigravity, Codex rollout limits, and Kimi plan profiles.
    depends_on: []

  - id: OBS-05
    title: Provider Quota API Adapters
    status: existing
    scope: core
    source: agent-monitor
    source_ref: src/limits/hosted.rs
    verdict: port
    summary: Read-only HTTP adapters read account quotas and credit balances for GLM, ZCode, Mistral, MiniMax, DeepSeek, and regional Xiaomi accounts via Keychain keys.
    depends_on: []

  - id: OBS-06
    title: Local Ollama Memory Monitor
    status: existing
    scope: core
    source: agent-monitor
    source_ref: src/limits/ollama.rs
    verdict: port
    summary: A five-second poller reads Ollama models, GPU residency, memory pressure, and estimated KV cache size with context warnings and a ten-minute timeline.
    depends_on: []

  - id: OBS-07
    title: Installed Agent Tool Discovery
    status: existing
    scope: supporting
    source: agent-monitor
    source_ref: src/agents.rs
    verdict: port
    summary: Background discovery detects installed coding CLIs and desktop apps, checks saved sign-in state and tool versions, and loads native or embedded icons.
    depends_on: []

  - id: OBS-08
    title: Artisan App Inventory
    status: existing
    scope: supporting
    source: artisan-apps
    source_ref: src/check.rs
    verdict: port
    summary: Live inventory reads installed Craft and creative apps inside the Artisan VM or locally and checks versions against cached GitHub releases.
    depends_on: [RUN-03]

  - id: OBS-09
    title: Loggia Token Usage Metering
    status: existing
    scope: core
    source: loggia
    source_ref: usage.py
    verdict: port
    summary: A persistent SQLite ledger records token counts from Kimi, GLM, Claude, Codex, and Antigravity logs plus per-agent Ollama metering proxies.
    depends_on: []

  - id: OBS-10
    title: Loggia Account Limit Poller
    status: existing
    scope: supporting
    source: loggia
    source_ref: limits.py
    verdict: retire
    summary: Loggia polls container-side CLI usage screens and Z.ai quotas in Python, and Astrolabe retires it in favor of Agent Monitor engines.
    depends_on: []

  - id: OBS-11
    title: Machine Resource Telemetry
    status: planned
    scope: core
    source: astrolabe
    summary: Native host telemetry tracks physical memory, CPU load, active containers, and Artisan VM health to feed resource budgets and capacity views.
    depends_on: [OBS-06, OBS-08]

  - id: OBS-12
    title: Cross-Tool Run and Commit Linking
    status: planned
    scope: core
    source: astrolabe
    summary: Unified observation queries link each agent run with its metered token spend, target repository, branch state, and final git commits.
    depends_on: [OBS-01, OBS-09, RUN-02]
