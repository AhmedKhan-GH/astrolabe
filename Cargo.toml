[workspace]
resolver = "3"
members = ["crates/astrolabe-contract", "crates/astrolabe-kit", "crates/astrolabe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
