site_name: Astrolabe
docs_dir: docs
site_dir: build/docs-site
# Internal commercial strategy stays in the repository and out of the built documentation site.
exclude_docs: |
  open-core.md
# Broken anchors fail the strict build too, like broken links.
validation:
  anchors: warn
theme:
  name: material
  # Icons, fonts and the stylesheet live outside docs/, which holds documents only.
  custom_dir: docs-theme
  logo: assets/astrolabe-icon-minerals.svg
  favicon: assets/astrolabe-icon-minerals.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
extra:
  # The header logo opens the full docs tree (docs/contents.md, filled by docs-theme/hooks/contents.py).
  homepage: contents/
# The navigation follows the folders under docs/; a .nav.yml in a folder sets its order.
hooks:
  - docs-theme/hooks/contents.py
plugins:
  - search
  - awesome-nav
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
