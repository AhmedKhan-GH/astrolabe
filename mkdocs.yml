site_name: Astrolabe
docs_dir: docs
site_dir: build/docs-site
# Broken anchors fail the strict build too, like broken links.
validation:
  anchors: warn
theme:
  name: material
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
extra:
  # The header logo opens the full docs tree (docs/contents.md, filled by the sternbild plugin).
  homepage: contents/
# A local `mkdocs serve` rebuilds when the registry changes.
watch:
  - roadmap
# The navigation follows the folders under docs/; a .nav.yml in a folder sets its order.
# The sternbild plugin supplies the theme, brand icon, contents tree, and roadmap pages.
plugins:
  - search
  - awesome-nav
  - sternbild:
      roadmap: roadmap/
      icon: assets/brand/astrolabe-icon-minerals.svg
      accent: "#4a5bac"
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
