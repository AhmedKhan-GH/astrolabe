<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12110f">
<title>Page Not Found · Astrolabe</title>
<link rel="icon" href="/astrolabe/assets/astrolabe-icon-minerals-32.png" sizes="32x32">
<link rel="icon" href="/astrolabe/assets/astrolabe-icon-minerals.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/astrolabe/assets/astrolabe-icon-minerals-180.png">
<style>
  @font-face { font-family: "Sternbild Display"; src: url("/astrolabe/assets/fonts/SternbildDisplay-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Plex Condensed"; src: url("/astrolabe/assets/fonts/IBMPlexSansCondensed-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Source Code Pro"; src: url("/astrolabe/assets/fonts/SourceCodePro-Regular.ttf") format("truetype"); font-display: swap; }

  /* Sternbild dark palette. */
  :root {
    --night: #12110f;
    --deep: #1c1b18;
    --ground: #181715;
    --plate: #272622;
    --plate-hover: #312f2b;
    --rule: #5a5751;
    --rule-faint: #36342f;
    --parchment: #f0e9db;
    --secondary: #d0c9ba;
    --faint: #a49d8f;
    --bronze: #b38b59;
    --bronze-hover: #c49b68;
    --max: 1160px;
    --display: "Sternbild Display", "Plex Condensed", sans-serif;
    --text: "Plex Condensed", -apple-system, "Helvetica Neue", sans-serif;
    --mono: "Source Code Pro", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--ground); color: var(--parchment); font: 17px/1.65 var(--text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; height: auto; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px 11px; font: 14px/1 var(--text);
         letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .btn-ghost { color: var(--parchment); background: var(--plate); border: 1px solid var(--rule); border-radius: 4px; }
  .btn-ghost:hover { background: var(--plate-hover); border-color: var(--faint); }

  /* Navigation */
  nav { position: sticky; top: 0; z-index: 20; background: rgba(18, 17, 15, .86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule-faint); }
  nav .wrap { display: flex; align-items: center; gap: 30px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 36px; height: 36px; }
  .brand span { font: 17px/1 var(--display); letter-spacing: .22em; padding-top: 2px; }
  nav .links { display: flex; gap: 26px; margin-left: auto; color: var(--secondary); font: 13px/1 var(--text); letter-spacing: .18em; text-transform: uppercase; }
  nav .links a:hover { color: var(--parchment); }

  /* 404 layout */
  .missing { min-height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 64px; padding-bottom: 64px; }
  .label { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--bronze); }
  .eyebrow { font: 13px/1 var(--text); letter-spacing: .26em; color: var(--bronze); text-transform: uppercase; }
  h2 { font: clamp(24px, 3vw, 36px)/1.2 var(--text); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 18px; font-weight: normal; }
  .lede { color: var(--secondary); font-size: clamp(17px, 1.9vw, 20px); max-width: 720px; margin: 0 auto 30px; text-wrap: pretty; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

  @media (max-width: 520px) {
    nav .wrap { gap: 16px; }
    nav .links { gap: 16px; }
    .brand span { display: none; }
    .wrap { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="/astrolabe/" aria-label="Astrolabe"><img src="/astrolabe/assets/astrolabe-icon-minerals.svg" alt="" width="36" height="36"><span>ASTROLABE</span></a>
    <div class="links">
      <a href="/astrolabe/docs/">Docs</a>
      <a href="https://github.com/AhmedKhan-GH/astrolabe">GitHub</a>
    </div>
  </div>
</nav>
<main class="wrap missing">
  <div class="label"><span class="eyebrow">404</span></div>
  <h2>Page Not Found</h2>
  <p class="lede">This address does not match a page on the Astrolabe site.</p>
  <div class="actions">
    <a class="btn btn-ghost" href="/astrolabe/">Astrolabe</a>
    <a class="btn btn-ghost" href="/astrolabe/docs/">Docs</a>
  </div>
</main>
</body>
</html>
