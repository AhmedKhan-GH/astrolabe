# electron-builder packaging config — one file shared across all platforms; the
# per-OS scripts (package:mac / package:win / package:linux) select which section
# runs. Each is built on its own native machine (no cross-compilation). The
# electron-vite bundles in out/ are produced first, then packaged into dist/.
appId: cool.astrolabe.app
productName: Astrolabe

directories:
  output: dist

# Ship the built bundles + the manifest; electron-builder additionally pulls in
# production dependencies from node_modules automatically (e.g. better-sqlite3 in
# Phase 2). Source, docs, and dev config are excluded.
files:
  - out/**
  - package.json

# Drizzle migrations are runtime-needed (run at boot) — ship them beside the asar.
# (Committed in-repo too: the iteration-2 gitignored-but-bundled scar, docs/01.)
extraResources:
  - from: drizzle
    to: drizzle

# Native addons must live outside the asar so their .node binaries can be loaded
# at runtime. Durable prep — a harmless no-op until a native dependency (Phase 2's
# better-sqlite3) exists. electron-builder rebuilds native modules against the
# Electron ABI per-device during packaging (npmRebuild default), which is the fix
# for the classic "works in node, crashes in Electron" mismatch.
#
# ACP dialogue spawn paths (2026-07-11-acp-dialogue-spec): Electron's node cannot
# `import` an ESM entry — nor exec a native binary — from INSIDE app.asar, so every
# adapter/MCP spawn target and its ESM import closure must be unpacked. adapters.ts
# rewrites the resolved `…/app.asar/…` paths to `…/app.asar.unpacked/…` at runtime.
#   - out/mcp/**                          the bundled stdio MCP server (ESM server.mjs)
#   - @agentclientprotocol/**             claude-agent-acp bin entry + its ACP sdk (ESM)
#   - @anthropic-ai/**                    the Claude Agent SDK the adapter imports (ESM)
#   - @zed-industries/**                  codex-acp shim + the per-platform NATIVE binary
#
# The MCP server (server.mjs) runs from app.asar.unpacked as its OWN spawned process, so its
# runtime require closure must ALSO be unpacked — the unpacked dir cannot resolve into the sibling
# asar. better-sqlite3 is auto-unpacked (it carries a .node), but its deps are not, so unpack them
# explicitly: better-sqlite3 → bindings → file-uri-to-path. (drizzle-orm/zod are bundled INTO
# server.mjs by esbuild, so only better-sqlite3 stays external.)
#   - node_modules/bindings/**            better-sqlite3's native-addon loader
#   - node_modules/file-uri-to-path/**    bindings' only runtime dep
asarUnpack:
  - '**/*.node'
  - out/mcp/**
  - node_modules/@agentclientprotocol/**
  - node_modules/@anthropic-ai/**
  - node_modules/@zed-industries/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
  # The claude adapter's own runtime imports (an unpacked process cannot resolve
  # into the sibling asar): zod is lazily imported by the ACP sdk at session
  # start; @modelcontextprotocol is the agent-sdk's MCP peer, lazily imported
  # when sessions mount MCP servers. Unpack the adapter's whole declared+peer
  # closure rather than chasing lazy imports one crash at a time.
  - node_modules/zod/**
  - node_modules/@modelcontextprotocol/**

mac:
  target:
    - dmg   # human download / drag-to-Applications
    - zip   # required by electron-updater's macOS feed (Phase 6)
  category: public.app-category.productivity
  # Self-signed "Astrolabe Dev" cert (login keychain): gives dev builds a
  # certificate-anchored designated requirement, so macOS TCC grants (iCloud
  # folder consent / Full Disk Access) survive rebuilds — ad-hoc signatures are
  # cdhash-anchored and silently orphan every grant on each rebuild. Replace
  # with a real Developer ID identity when distribution starts (Phase 6).
  identity: Astrolabe Dev

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Utility
